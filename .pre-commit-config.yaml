repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

# Linter et Formateur d'Infrastructure (Terraform)
-   repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.1
    hooks:
    -   id: terraform_fmt

# Linter et Formateur Python ultra-rapide (Ruff)
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
    -   id: ruff
        args: [ --fix ]
    -   id: ruff-format

# Linter SQL (SQLFluff) configuré pour dbt
-   repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.0.3
    hooks:
    -   id: sqlfluff-lint
        # On injecte les dépendances pour que SQLFluff comprenne dbt et Athena
        additional_dependencies: ['dbt-athena-community', 'sqlfluff-templater-dbt']